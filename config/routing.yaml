# routing.yaml - 智能路由配置
# 定义不同场景的关键词匹配规则和优先级

routing:
  # 闲聊场景
  chitchat:
    keywords:
      - "你好"
      - "您好"
      - "嗨"
      - "hello"
      - "hi"
      - "谢谢"
      - "感谢"
      - "再见"
      - "拜拜"
      - "bye"
    priority: 1
    response: "你好！我是文档分析助手，有什么可以帮你的吗？"

  # 混合问答场景（优先级高于纯文档）
  hybrid:
    keywords:
      - "你怎么看"
      - "你的看法"
      - "你的理解"
      - "谈谈.*理解"
      - "结合.*分析"
      - "补充.*说明"
      - "分析一下"
      - "理解"
    priority: 2

  # 文档问答场景
  document:
    keywords:
      - "文档"
      - "根据"
      - "总结"
      - "文章"
      - "内容"
      - "提到"
      - "文中"
      - "原文"
      - "摘录"
    priority: 3

  # 通用问答场景（最低优先级）
  general:
    priority: 4
    description: "使用模型自身知识回答，不依赖文档"